<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ten" />
  <title>Ten</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="error" style="display:none"></div>

  <div id="app">
    <header>
      <div>
        <h1>Ten</h1>
        <span id="date-label"></span>
      </div>
      <div class="mode-toggle-wrap">
        <div class="mode-toggle" role="group" aria-label="Learning mode">
          <button class="mode-toggle-btn active" type="button" data-mode="pt-br" aria-pressed="true" aria-label="Switch to Brazilian Portuguese">🇧🇷</button>
          <button class="mode-toggle-btn" type="button" data-mode="fr" aria-pressed="false" aria-label="Switch to Quebec French">🇨🇦</button>
        </div>
      </div>
    </header>

    <div id="top-tabs" role="tablist" aria-label="Main tabs">
      <button class="top-tab" data-tab="daily" role="tab" aria-selected="false">10/day</button>
      <button class="top-tab active" data-tab="translate" role="tab" aria-selected="true">Translate</button>
      <button class="top-tab" data-tab="review" role="tab" aria-selected="false">Review</button>
      <button class="top-tab" data-tab="frequency" role="tab" aria-selected="false">Frequency dictionary</button>
    </div>

    <section id="tab-daily" class="tab-panel" role="tabpanel">
      <div id="dots"></div>

      <div id="card">
        <div class="word-row">
          <span id="word"></span>
          <button id="speak-btn" class="speak-btn" type="button" title="Hear pronunciation" aria-label="Hear pronunciation">🔊</button>
        </div>
        <p id="translation"></p>
        <p id="daily-frequency-rank" class="frequency-meta"></p>
        <hr class="divider" />
        <span class="sentences-label" id="sentence-language-label">Portuguese in use</span>
        <div class="sentence">
          <div class="sentence-content">
            <span class="sentence-l2" id="s1-l2"></span>
            <span class="sentence-en" id="s1-en"></span>
          </div>
          <button class="sentence-speak-btn speak-btn" id="s1-speak-btn" type="button" title="Hear sentence" aria-label="Hear sentence">🔊</button>
        </div>
        <div class="sentence">
          <div class="sentence-content">
            <span class="sentence-l2" id="s2-l2"></span>
            <span class="sentence-en" id="s2-en"></span>
          </div>
          <button class="sentence-speak-btn speak-btn" id="s2-speak-btn" type="button" title="Hear sentence" aria-label="Hear sentence">🔊</button>
        </div>
      </div>

      <nav id="daily-nav">
        <button id="prev-btn">← Prev</button>
        <button id="next-btn">Next →</button>
      </nav>
      <p id="counter"></p>
      <p id="pool-info"></p>
      <div class="daily-add-buttons">
        <button id="add-word-btn" class="daily-add-btn" type="button">Add word</button>
        <button id="add-s1-btn" class="daily-add-btn" type="button">Add sentence 1</button>
        <button id="add-s2-btn" class="daily-add-btn" type="button">Add sentence 2</button>
        <button id="add-all-btn" class="daily-add-btn" type="button">Add all</button>
      </div>
      <p id="daily-save-status" class="status-line"></p>
    </section>

    <section id="tab-translate" class="tab-panel active" role="tabpanel">
      <div class="surface-card">
        <h2>Translate</h2>
        <div class="translate-direction-row" aria-label="Translation direction">
          <div id="translate-from-side" class="translate-direction-side">
            <span id="translate-from-caption" class="translate-direction-caption">From</span>
            <span id="translate-from-label" class="translate-direction-lang">Brazilian</span>
          </div>
          <button id="swap-languages-btn" type="button" class="swap-languages-btn" aria-label="Swap languages" title="Swap languages">⇄</button>
          <div class="translate-direction-side">
            <span class="translate-direction-caption">To</span>
            <span id="translate-to-label" class="translate-direction-lang">English</span>
          </div>
        </div>
        <label class="field">
          <span>Text</span>
          <div class="translate-input-row">
            <textarea id="translate-input" rows="4" placeholder="Type or paste text to translate..."></textarea>
            <span id="translate-speak-slot-input" class="translate-speak-slot"></span>
          </div>
        </label>
        <div class="translate-action-row">
          <button id="translate-btn" class="primary-btn">Translate</button>
          <button id="clear-translate-btn" type="button" class="clear-translate-btn" aria-label="Clear translation input and result" title="Clear">✕</button>
        </div>
        <p id="translate-status" class="status-line"></p>
        <div id="translate-result-wrap" class="hidden">
          <span class="caps-label">Result</span>
          <div class="translate-result-row">
            <p id="translate-result-text" class="translate-result-text"></p>
            <span id="translate-speak-slot-result" class="translate-speak-slot"></span>
          </div>
        </div>
        <button id="translate-speak-btn" type="button" class="speak-btn" title="Hear pronunciation" aria-label="Hear pronunciation">🔊</button>
        <p id="translate-frequency-rank" class="status-line"></p>
        <div class="button-row">
          <button id="quick-add-card-btn" class="primary-btn" disabled>Add to Anki</button>
          <button id="toggle-note-config-btn" disabled>Configure note</button>
        </div>
        <p id="quick-add-status" class="status-line"></p>
      </div>

      <div id="flashcard-draft-card" class="surface-card hidden">
        <h2>Flashcard note config</h2>
        <label class="field">
          <span>Front (English)</span>
          <input id="card-front-input" placeholder="English word, phrase, or sentence" />
        </label>
        <label class="field">
          <span id="card-back-label">Back (Portuguese)</span>
          <input id="card-back-input" placeholder="Portuguese translation" />
        </label>
        <label class="field">
          <span>Context (optional)</span>
          <textarea id="card-context-input" rows="3" placeholder="Sentence, nuance, or reminder"></textarea>
        </label>
        <div class="button-row">
          <button id="save-card-btn" class="primary-btn">Add to Anki</button>
          <button id="add-anki-btn">Add + Open Review</button>
        </div>
        <p id="card-save-status" class="status-line"></p>
      </div>
    </section>

    <section id="tab-review" class="tab-panel" role="tabpanel">
      <div class="review-stats">
        <div class="stat-box">
          <span class="stat-label">To study</span>
          <span class="stat-value" id="review-due-count">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Total cards</span>
          <span class="stat-value" id="review-total-count">0</span>
        </div>
      </div>

      <div id="review-empty" class="surface-card">
        <span class="caps-label">All clear</span>
        <p>No new or due cards in this Anki deck. Add cards from Translate or 10/day, then refresh.</p>
      </div>

      <div id="review-card-panel" class="surface-card hidden">
        <span class="caps-label">Front</span>
        <p id="review-front-text" class="review-front"></p>
        <p id="review-context" class="review-context hidden"></p>

        <div id="review-answer-wrap" class="hidden">
          <span class="caps-label">Back</span>
          <div class="review-back-row">
            <p id="review-back-text" class="review-back"></p>
            <button id="review-speak-btn" type="button" class="speak-btn" title="Hear back" aria-label="Hear back">🔊</button>
          </div>
        </div>

        <div class="button-row">
          <button id="review-show-answer-btn" class="primary-btn">Show answer</button>
        </div>

        <div id="review-grade-row" class="grade-row hidden">
          <button data-grade="again">Again</button>
          <button data-grade="hard">Hard</button>
          <button data-grade="good">Good</button>
          <button data-grade="easy">Easy</button>
        </div>

        <div class="button-row">
          <button id="review-card-delete">Delete Card</button>
        </div>
      </div>

      <button id="review-refresh-btn" class="wide-btn">Refresh from Anki</button>
      <p id="review-status" class="status-line"></p>
    </section>

    <section id="tab-frequency" class="tab-panel" role="tabpanel">
      <span id="frequency-mode-label" class="caps-label">Brazilian dictionary</span>
      <div class="frequency-summary">
        <button type="button" class="stat-box frequency-stat-box" id="frequency-entries-stat">
          <span class="stat-label">Entries</span>
          <span class="stat-value" id="frequency-total-count">0</span>
        </button>
        <button type="button" class="stat-box frequency-stat-box" id="frequency-unlocked-stat" aria-pressed="false">
          <span class="stat-label">Unlocked</span>
          <span class="stat-value frequency-seen-value" id="frequency-seen-count">0</span>
        </button>
      </div>
      <label class="field frequency-search-field">
        <span>Search</span>
        <input id="frequency-search-input" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Rank (#42) or word…" />
      </label>
      <p id="frequency-search-hint" class="status-line frequency-search-hint hidden" aria-live="polite"></p>
      <p id="frequency-status" class="status-line"></p>
      <div id="frequency-list" class="frequency-list" aria-live="polite"></div>
    </section>

  </div>

  <script src="/confetti.browser.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
